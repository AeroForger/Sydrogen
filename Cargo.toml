[package]
name = "furnace"
version = "0.7.0"
edition = "2021"
description = "Compiler for the Sydrogen systems programming language"
license = "GPL-3.0-only"
repository = "https://github.com/AeroForger/Sydrogen"

[lib]
name = "furnace"
path = "src/lib.rs"

[[bin]]
name = "furnace"
path = "Cli/main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
rayon = "1.11"
cranelift = "0.135.1"
cranelift-codegen = "0.135.1"
cranelift-frontend = "0.135.1"
cranelift-module = "0.135.1"
cranelift-object = "0.135.1"
cranelift-native = "0.135.1"
target-lexicon = "0.13.5"
which = "8.0.6"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
